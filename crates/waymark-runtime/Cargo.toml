[package]
name = "waymark-runtime"
version.workspace = true
edition = "2021"
license.workspace = true

[lib]
name = "waymark_runtime"

[dependencies]
asset-image = { path = "../asset-image" }
waymark-gateway-client = { path = "../../../waymark-gateway/crates/waymark-gateway-client" }
waymark-runtime-support = { path = "../waymark-runtime-support" }
libc = "0.2.186"
md5 = { version = "0.10", package = "md-5" }
memchr = "2.8.0"
nu-protocol = { version = "0.112.2", default-features = false }
nu-system = "0.112.2"
regex = "1.12.2"
ruff_python_parser = { git = "https://github.com/astral-sh/ruff", tag = "0.15.11", package = "ruff_python_parser" }
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", tag = "0.15.11", package = "ruff_python_ast" }
serde_json = "1.0"
sha1 = "0.10"
sha2 = "0.10"
sysinfo = "0.38.4"

[features]
default = []

[target.'cfg(target_os = "hermit")'.dependencies]
hermit-abi = { path = "../../../helix/third_party/hermit-rs/hermit-abi" }
